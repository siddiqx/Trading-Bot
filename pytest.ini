[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
norecursedirs = archives .venv .venv_linux forex-signal-bot
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:google.protobuf.*
    ignore:.*httpx.*starlette.testclient.*

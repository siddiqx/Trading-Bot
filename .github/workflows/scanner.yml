name: 24/7 Cloud Market Scanner

on:
  schedule:
    # Run every 15 minutes during Forex market hours (Mon-Fri)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web UI at any time

permissions:
  contents: write

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install httpx pandas numpy

      - name: Restore Signal State Cache
        uses: actions/cache@v4
        with:
          path: |
            market_scanner_state.json
          key: market-state-${{ github.run_id }}
          restore-keys: |
            market-state-

      - name: Execute Market Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_scanner.py

      - name: Commit & Push Updated Trade Records
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain trade_records.json)" ]; then
            git add trade_records.json
            git commit -m "chore(ledger): update forward trade records from 24/7 cloud scanner"
            git push origin main
          fi

      - name: Save Signal State Cache
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            market_scanner_state.json
          key: market-state-${{ github.run_id }}

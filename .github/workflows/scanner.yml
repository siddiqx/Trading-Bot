name: 24/7 Cloud Market Scanner

on:
  schedule:
    # Run every 15 minutes 24/5 during Forex market hours (Mon-Fri)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Manual trigger from GitHub web UI at any time

# Prevent concurrent runs from racing each other and double-firing signals
concurrency:
  group: market-scanner
  cancel-in-progress: false  # Never cancel a running scan — let it finish

permissions:
  contents: write

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # Hard cap: scanner must complete within 8 min or be killed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --quiet httpx pandas numpy websocket-client

      - name: Restore Signal State Cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: market_scanner_state.json
          key: market-state-${{ github.run_id }}
          restore-keys: |
            market-state-

      - name: Verify State Restored
        run: |
          if [ -f market_scanner_state.json ]; then
            python3 -c "import json; d=json.load(open('market_scanner_state.json')); print('State file restored:', len(d.get('alerted_signals', [])), 'signals in state')"
          else
            echo "No state cache found — starting fresh (first run or cache expired)"
            echo '{"alerted_signals":[]}' > market_scanner_state.json
          fi

      - name: Validate Telegram Secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::warning title=Missing Telegram Credentials::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured in GitHub Repository Secrets. Outbound trade signals will be dropped until secrets are set."
          else
            echo "Telegram credentials verified present in GitHub Secrets."
          fi

      - name: Execute Market Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_scanner.py

      - name: Commit & Push Updated Trade Records
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain trade_records.json data/ journals/)" ]; then
            git add trade_records.json data/ journals/
            git commit -m "chore(ledger): update trade records and post-mortem journals [skip ci]"
            git push origin main || echo "::warning title=Git Push Denied::git push to main failed. Verify Settings -> Actions -> General -> Workflow permissions has 'Read and write permissions' enabled."
          else
            echo "No trade record changes to commit."
          fi

      - name: Save Signal State Cache
        uses: actions/cache@v4
        if: always()
        with:
          path: market_scanner_state.json
          key: market-state-${{ github.run_id }}
